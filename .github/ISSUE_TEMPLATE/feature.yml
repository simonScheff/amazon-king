name: Feature request
description: Propose a scoped product or engineering improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior without assuming an implementation.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and compatibility
      description: Note effects on Amazon writes, data access, rules, configuration, or migrations.
