services:
  db:
    image: postgres:16-alpine
    container_name: amazon-king-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: amazon_king
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amazon_king"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
