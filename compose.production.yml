services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: amazon_king
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: amazon_king
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amazon_king -d amazon_king"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: api
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql://amazon_king:${POSTGRES_PASSWORD}@db:5432/amazon_king
    command: ["pnpm", "exec", "tsx", "scripts/migrate.ts"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://amazon_king:${POSTGRES_PASSWORD}@db:5432/amazon_king
      PORT: 3000
      TRUST_PROXY: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://amazon_king:${POSTGRES_PASSWORD}@db:5432/amazon_king
      REPORT_STORAGE_DIR: /app/.data/reports
    volumes:
      - report-data:/app/.data/reports
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  report-data:
